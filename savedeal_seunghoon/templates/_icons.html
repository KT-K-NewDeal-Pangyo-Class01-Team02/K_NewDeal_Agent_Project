{# lucide 아이콘 (https://lucide.dev, ISC License) 원본 SVG 경로를 스프라이트로 모은 것.
   템플릿에서는 icon() 매크로로, JS에서는 <use href="#icon-이름">으로 같은 아이콘을 쓴다.
   크기·색·선 굵기는 CSS의 .icon 규칙이 정한다. #}
{% macro icon(name, class_name="") -%}
<svg class="icon {{ class_name }}" aria-hidden="true" focusable="false"><use href="#icon-{{ name }}"></use></svg>
{%- endmacro %}
